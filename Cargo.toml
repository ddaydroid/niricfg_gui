[package]
name = "dotcfg-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Extensible GTK4/libadwaita dotfile config editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/d3t0x/niricfg_gui"
keywords = ["wayland", "niri", "gtk4", "config", "gui"]
categories = ["gui", "config"]
publish = false

[features]
# `gtk` is opt-in to keep `--no-default-features` builds free of GTK system deps.
# CI runs `cargo clippy --features gtk`, etc.; users running plain `cargo check`
# stay in the lightweight core layer (kdl + async-std + notify + thiserror).
gtk = ["dep:gtk4", "dep:libadwaita", "dep:glib", "dep:gio"]

[dependencies]
# Core (always built)
kdl = "6"
async-std = { version = "1.13", features = ["attributes"] }
async-process = "2"
notify = "7"
thiserror = "1"

# GTK-gated (only built with --features gtk)
gtk4 = { version = "0.9", optional = true, features = ["v4_14"] }
libadwaita = { version = "0.7", optional = true, features = ["v1_5"] }
glib = { version = "0.20", optional = true }
gio = { version = "0.20", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
