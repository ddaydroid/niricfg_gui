name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --features gtk -- -D warnings

  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  test:
    name: Tests (Debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (no GTK)
        run: cargo nextest run --no-default-features
      - name: Integration tests (xvfb)
        run: xvfb-run -a cargo nextest run --features gtk --no-fail-fast

  proptest:
    name: Property Tests (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
      - name: Property tests with PROPTEST_CASES=2000
        env:
          PROPTEST_CASES: "2000"
        run: xvfb-run -a cargo nextest run --features gtk --release

  fuzz:
    name: Fuzz (kdl_parser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # cargo-fuzz 0.13.x hardcodes `--target x86_64-unknown-linux-musl`
          # in its inner cargo invocation (cit.
          # cargo-fuzz-0.13.2/src/project.rs:143 `.arg("--target")`). Without
          # this `targets:` field the runner has no musl std library, so
          # rustc errors with E0463 "can't find crate for `core`".
          targets: x86_64-unknown-linux-musl
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo fuzz on kdl_parser (30s budget)
        env:
          # Disable static libc linking so libFuzzer's AddressSanitizer works.
          # libfuzzer-sys's build.rs forces +crt-static by default; we override.
          RUSTFLAGS: "-C target-feature=-crt-static"
          # Override the cc crate's target-specific compiler lookup for the
          # x86_64-unknown-linux-musl target (cargo-fuzz's hardcoded target).
          # libfuzzer-sys's build.rs looks up x86_64-linux-musl-g++ by default
          # (warning: "Compiler family detection failed due to error: ToolNotFound:
          # failed to find tool \"x86_64-linux-musl-g++\""). We redirect to the
          # host's gcc/g++ (already installed by build-essential above) via
          # rust's CC_<TARGET>/CXX_<TARGET> env-var convention (dashes in target
          # triple become underscores). The cc crate reads these before falling
          # back to the cross-prefix lookup.
          CC_x86_64_unknown_linux_musl: gcc
          CXX_x86_64_unknown_linux_musl: g++
        # Fails until fuzz/fuzz_targets/kdl_parser.rs is committed; this enforces Step 19/21 of the spec.
        run: cargo +nightly fuzz run kdl_parser -- -max_total_time=30
