name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --features gtk -- -D warnings
      - name: Mock validator smoke test
        run: |
          set -e
          echo "=== Mock validator against valid fixtures ==="
          for f in tests/fixtures/minimal.kdl tests/fixtures/typical.kdl \
                   tests/fixtures/comments-rich.kdl tests/fixtures/binds-heavy.kdl \
                   tests/fixtures/nested.kdl tests/fixtures/empty.kdl; do
            if bash tests/mocks/validate-fake.sh "$f"; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              exit 1
            fi
          done
          echo "=== Mock validator against invalid fixture ==="
          if ! bash tests/mocks/validate-fake.sh tests/fixtures/invalid-syntax.kdl; then
            echo "  OK: invalid-syntax.kdl correctly rejected"
          else
            echo "  FAIL: invalid-syntax.kdl should have been rejected"
            exit 1
          fi
          echo "=== Mock validator smoke test PASSED ==="

  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  test:
    name: Tests (Debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (no GTK)
        run: cargo nextest run --no-default-features
      - name: Integration tests (xvfb)
        run: xvfb-run -a cargo nextest run --features gtk --no-fail-fast

  proptest:
    name: Property Tests (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
      - name: Property tests with PROPTEST_CASES=2000
        env:
          PROPTEST_CASES: "2000"
        run: xvfb-run -a cargo nextest run --features gtk --release

  fuzz:
    name: Fuzz (kdl_parser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install GTK4/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            pkg-config \
            build-essential
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
      - name: Verify kdl_parser fuzz target is registered
        run: |
          set -e
          echo "=== cargo fuzz list ==="
          TARGETS=$(cd fuzz && cargo +nightly fuzz list)
          echo "$TARGETS"
          if echo "$TARGETS" | grep -q '^kdl_parser$'; then
            echo "  OK: kdl_parser target is registered"
          else
            echo "  FAIL: kdl_parser target NOT found in fuzz target list"
            exit 1
          fi
      - name: Run cargo fuzz on kdl_parser (30s budget)
        env:
          # Disable static libc linking so libFuzzer's AddressSanitizer works
          # (libfuzzer-sys's build.rs forces +crt-static by default; rustc
          # error: "sanitizer is incompatible with statically linked libc,
          # disable it using -C target-feature=-crt-static"). This flag is
          # independent of the fuzz target triple.
          RUSTFLAGS: "-C target-feature=-crt-static"
        # Fails until fuzz/fuzz_targets/kdl_parser.rs is committed; enforces
        # Step 19/21 of the spec. Use --target=x86_64-unknown-linux-gnu to build
        # for the runner's native triple, avoiding cargo-fuzz 0.13.x's default
        # musl target (whose std lib + cross-prefix gcc/g++ aren't on the
        # ubuntu-24.04 runner — ASan link fails with "DSO missing from command
        # line" if musl is used; saw on commit 46d876a). cargo-fuzz honors
        # --target <triple> via src/options.rs + src/project.rs:143.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu kdl_parser -- -max_total_time=30

  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-24.04
    # Flatpak infra changes can break out of our control, but we want
    # to know about it — informational check, not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # Cache the Flatpak SDK installation across runs. Cache key includes
      # the manifest hash so it auto-invalidates when the runtime version
      # changes (e.g., from 47 to 48 in com.github.d3t0x.dotcfg-gui.yml).
      - name: Cache Flatpak SDK
        id: cache-flatpak
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-${{ hashFiles('com.github.d3t0x.dotcfg-gui.yml') }}-${{ runner.os }}

      - name: Install GNOME 47 SDK and rust-stable extension
        if: steps.cache-flatpak.outputs.cache-hit != 'true'
        run: |
          flatpak --user install -y flathub \
            org.gnome.Sdk/x86_64/47 \
            org.gnome.Platform/x86_64/47 \
            org.freedesktop.Sdk.Extension.rust-stable/x86_64/24.08

      - name: Build Flatpak (cached cargo build, vendored deps)
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --install \
            --ccache \
            build-dir \
            com.github.d3t0x.dotcfg-gui.yml

      - name: Verify installed files
        run: |
          set -e
          echo "=== Flatpak build artifacts ==="
          flatpak run --command=sh com.github.d3t0x.dotcfg-gui -c '
            echo "Binary:"
            ls -la /app/bin/dotcfg-gui
            echo "Desktop entry:"
            ls -la /app/share/applications/com.github.d3t0x.dotcfg-gui.desktop
            echo "Icon:"
            ls -la /app/share/icons/hicolor/scalable/apps/com.github.d3t0x.dotcfg-gui.svg
          '
          echo "  OK: All Flatpak artifacts installed"
